name: tests

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the package and its test dependencies
        run: pip install -e ".[dev]"
      - name: Run the tests
        run: pytest
